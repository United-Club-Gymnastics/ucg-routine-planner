<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAG Calibration · UCG Judge Practice</title>
    <meta name="description" content="Practice judging UCG MAG routines (Developmental, Intermediate, Advanced) on calibration videos: enter difficulty, neutral and execution deductions, and check them against the answer key." />
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../infinity/practice.css?v=__BUILD__" />
    <link rel="stylesheet" href="practice.css?v=__BUILD__" />
  </head>
  <body>
    <header class="cp-header">
      <img src="../../assets/ucg-mark.svg" alt="" class="cp-mark" />
      <div>
        <h1 class="cp-display">Judge Practice</h1>
        <p class="cp-subhead">MAG · calibration routines</p>
      </div>
      <p class="cp-progress" id="cp-progress"></p>
    </header>

    <nav class="cp-picker" aria-label="Routines">
      <div class="cp-tabs" role="tablist" id="cp-tabs"></div>
      <div class="cp-chips" id="cp-chips"></div>
      <p class="cp-legend"><span class="cp-legend-right">✓</span> right <span class="cp-legend-off">•</span> tried, not right yet</p>
    </nav>

    <main class="cp-main is-landscape" id="cp-main">
      <section class="cp-video-col" aria-label="Routine video">
        <div class="cp-video-frame">
          <iframe id="cp-video" title="Routine video" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <p class="cp-video-meta"><span id="cp-video-name"></span> · <a id="cp-video-link" target="_blank" rel="noopener"></a></p>
        <div class="cp-intro" id="cp-intro"></div>
      </section>

      <section class="cp-calc-col" aria-label="Judging calculator">
        <form id="cp-calc" autocomplete="off" novalidate>
          <div id="cp-calc-fields"></div>

          <div class="cp-actions">
            <button type="button" class="cp-btn cp-btn-primary" id="cp-check">Did I get it right?</button>
            <button type="button" class="cp-btn" id="cp-reset">Reset</button>
          </div>
        </form>

        <div id="cp-result" hidden></div>
      </section>
    </main>

    <section class="cp-breakdown" id="cp-breakdown" hidden aria-label="Routine laid out"></section>

    <footer class="cp-footer">
      Feedback? <a href="mailto:rules@unitedclubgymnastics.org">rules@unitedclubgymnastics.org</a>
    </footer>

    <script type="module" src="practice.js"></script>
  </body>
</html>
