name: Build, test and deploy to GitHub Pages

# Every push to main and every pull request runs `check`: the vendored skill bundle against its lock,
# js/data rebuilt from the bundle and compared, the scoring tests, the site build and a browser smoke
# test of the build. On main (and workflow_dispatch) `deploy` then publishes that same build.
# Actions are pinned to commit SHAs (the version is the comment).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install build tools (no install scripts; esbuild's binary is the one we need)
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Check the vendored skill bundle against its lock (a hand edit fails here)
        run: npm run check-bundle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Rebuild js/data from the vendored bundle and compare (a stale or hand-edited js/data fails here)
        run: |
          python tools/build_skills.py
          python tools/build_data.py
          git diff --exit-code --stat -- js/data
      - name: Test scoring
        run: npm test
      - name: Build the site (bundled, hashed file names) into _site/
        run: npm run build
      - name: Smoke test the built site in a browser
        run: |
          npx playwright install --with-deps chromium
          npm run smoke
      - name: Upload the build for deploy (main only)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
